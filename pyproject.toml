[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arabizi"
version = "0.1.0"
description = "Moroccan Arabizi transliteration, Arabic normalization and word-level code-switching detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Novagios", email = "contact@novagios.com" }]
keywords = ["arabizi", "arabic", "darija", "morocco", "nlp", "transliteration", "code-switching"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Arabic",
    "Natural Language :: French",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.10", "ruff>=0.5"]

[project.scripts]
arabizi = "arabizi.cli:main"

[project.urls]
Homepage = "https://github.com/novagiosAI/arabizi"
Repository = "https://github.com/novagiosAI/arabizi"
Issues = "https://github.com/novagiosAI/arabizi/issues"
Changelog = "https://github.com/novagiosAI/arabizi/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/arabizi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/arabizi"]
